name: Windows installer
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - install.ps1
      - tests/install-windows.ps1
      - .config/**
      - agents/**
      - .github/workflows/windows.yml
jobs:
  install:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Check installed files are readable at expected paths
        shell: pwsh
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./tests/install-windows.ps1
